name: DOLOS secure build and verification
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Unit and security tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Compile bounded native validator
        run: make native-library
      - name: Run integrated unit tests
        run: python -m unittest discover -s tests -v
      - name: Enforce SAST patterns
        run: python scripts/sast_gate.py
  sast:
    name: Bandit and automated severity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Bandit (high severity and confidence gate)
        run: |
          mkdir -p evidence
          bandit -r dolos run.py -lll -i -f json -o evidence/bandit.json || exit 1
      - name: Security policy rejects open high/critical findings
        run: python scripts/security_gate.py --input scripts/findings-clean.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: evidence/bandit.json
          if-no-files-found: warn
  native:
    name: Native bounds check and AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/verify_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ASAN-evidence
          path: evidence/0*-overflow-*.txt
  dast:
    name: OWASP ZAP baseline and high-risk gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile bounded native validator
        run: make native-library
      - name: Start hardened server on loopback
        run: |
          python run.py > /tmp/dolos.log 2>&1 &
          echo $! > /tmp/dolos.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/health && break || sleep 1; done
      - name: OWASP ZAP baseline
        run: |
          mkdir -p evidence
          chmod 777 evidence
          docker run --rm --network host -v "$PWD/evidence:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5000 -m 1 -I -J zap.json || echo 'ZAP completed with nonzero exit; inspect report and policy gate'
      - name: Fail on missing report or high alerts
        run: python scripts/zap_gate.py evidence/zap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAP-DAST-report
          path: evidence/zap.json
          if-no-files-found: warn
  container:
    name: Docker hardening and Trivy vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root image
        run: docker build -t dolos:ci .
      - name: Check configured user
        run: test "$(docker inspect dolos:ci --format '{{.Config.User}}')" = dolos
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dolos:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
